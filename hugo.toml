baseURL = "https://miasyster.github.io/"
title = "Miasyster's Engineering Blog"
theme = "PaperMod"
defaultContentLanguage = "zh"
enableRobotsTXT = true

[languages]
  [languages.zh]
    languageName = "中文"
    weight = 1
    title = "AI + 量化工程"
    [languages.zh.params]
      description = "AI Agent 架构 / 量化研究系统 / 工程实践"
    [[languages.zh.menu.main]]
      name = "文章"
      url = "/posts/"
      weight = 1
    [[languages.zh.menu.main]]
      name = "关于"
      url = "/about/"
      weight = 2
  [languages.en]
    languageName = "English"
    weight = 2
    title = "AI + Quant Engineering"
    [languages.en.params]
      description = "AI Agent Architecture / Quant Research Systems / Engineering Practice"
    [[languages.en.menu.main]]
      name = "Posts"
      url = "/en/posts/"
      weight = 1
    [[languages.en.menu.main]]
      name = "About"
      url = "/en/about/"
      weight = 2

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  # Analytics — fill in after registering
  umamiWebsiteId = "f921b2b5-bb44-44f1-9026-405a5d9b6dba"
  # googleSiteVerification = "your-google-verification-code"
  [params.homeInfoParams]
    Title = "AI + Quant Engineering"
    Content = "Building production-grade AI-orchestrated quantitative research systems. Writing about architecture decisions, engineering trade-offs, and lessons learned."
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Miasyster"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:qq853777924@gmail.com"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]
